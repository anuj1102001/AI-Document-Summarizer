# Render Blueprint: the Margin API as a free Docker web service.
# Dashboard -> New -> Blueprint -> pick this repo. Render asks for the two secret values below.
# Services deploy from the branch the Blueprint tracks (set it in the Blueprint settings, e.g. main).
services:
  - type: web
    name: margin-api
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false # secret: entered in the Render dashboard, never committed
      - key: CORS_ORIGINS
        sync: false # the frontend's URL, e.g. https://margin.vercel.app
